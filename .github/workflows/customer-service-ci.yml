name: Customer Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Java Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/customer-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/customer-service/pom.xml

      - name: Build and run unit tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Build Docker image
        run: docker build -t customer-service:ci .
